name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: chmod +x gradlew
      - run: ./gradlew test build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MotionUI
          path: build/libs/*.jar
