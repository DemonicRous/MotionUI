buildscript {
    repositories { mavenCentral(); maven { url = 'https://maven.minecraftforge.net/' }; maven { url = 'https://github.com/juanmuscaria/maven/raw/master' } }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle2:[2.3-1.0.0-SNAPSHOT,)' }
}
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'eclipse'
apply plugin: 'idea'
version = mod_version
group = mod_group
archivesBaseName = mod_archives_name
sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
compileJava.options.encoding = 'UTF-8'
minecraft { version = "${mc_version}-${forge_version}"; mappings = 'stable_39'; runDir = 'run'; replace '@VERSION@', project.version; replaceIn 'MotionUI.java' }
runClient { jvmArgs '-Dfml.coreMods.load=com.demonicrous.motionui.core.MotionUILoadingPlugin' }
dependencies { testCompile 'junit:junit:4.13.2' }
processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) { include 'mcmod.info'; expand(mod_version: project.version) }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}
jar { manifest { attributes('FMLCorePlugin': 'com.demonicrous.motionui.core.MotionUILoadingPlugin', 'FMLCorePluginContainsFMLMod': 'true', 'Implementation-Title': 'MotionUI', 'Implementation-Version': project.version, 'Implementation-Vendor': 'DemonicRous') } }
task sourcesJar(type: Jar, dependsOn: classes) { classifier = 'sources'; from sourceSets.main.allSource }
artifacts { archives sourcesJar }
