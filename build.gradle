buildscript {
    repositories { mavenCentral(); maven { url = 'https://maven.minecraftforge.net/' }; maven { url = 'https://github.com/juanmuscaria/maven/raw/master' } }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle2:[2.3-1.0.0-SNAPSHOT,)' }
}
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'eclipse'
apply plugin: 'idea'
version = mod_version
group = mod_group
archivesBaseName = mod_archives_name
sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
compileJava.options.encoding = 'UTF-8'
minecraft { version = "${mc_version}-${forge_version}"; mappings = 'stable_39'; runDir = 'run'; replace '@VERSION@', project.version; replaceIn 'MotionUI.java' }
runClient { jvmArgs '-Dfml.coreMods.load=com.demonicrous.motionui.core.MotionUILoadingPlugin' }
dependencies { testCompile 'junit:junit:4.13.2' }
processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) { include 'mcmod.info'; expand(mod_version: project.version) }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}
jar { manifest { attributes('FMLCorePlugin': 'com.demonicrous.motionui.core.MotionUILoadingPlugin', 'FMLCorePluginContainsFMLMod': 'true', 'Implementation-Title': 'MotionUI', 'Implementation-Version': project.version, 'Implementation-Vendor': 'DemonicRous') } }
task sourcesJar(type: Jar, dependsOn: classes) { classifier = 'sources'; from sourceSets.main.allSource }
artifacts { archives sourcesJar }

def productionJar = file("${buildDir}/libs/${archivesBaseName}-${version}-release.jar")

task packageProductionJar(dependsOn: reobfJar) {
    group = 'build'
    description = 'Copies the reobfuscated artifact to a filename that runClient cannot overwrite.'
    outputs.file productionJar
    doLast {
        copy {
            from jar.archivePath
            into productionJar.parentFile
            rename { productionJar.name }
        }
    }
}

task verifyProductionJar(dependsOn: packageProductionJar) {
    group = 'verification'
    description = 'Rejects a release JAR that still contains development (MCP) method names.'
    doLast {
        def output = productionJar
        def archive = new java.util.zip.ZipFile(output)
        try {
            def entry = archive.getEntry('com/demonicrous/motionui/client/MotionUIClientEvents.class')
            if (entry == null) {
                throw new GradleException("MotionUIClientEvents.class is missing from ${output}")
            }
            def constants = new String(archive.getInputStream(entry).bytes, 'ISO-8859-1')
            def developmentNames = ['getKeyCode', 'getMinecraft', 'displayGuiScreen']
            def leaked = developmentNames.findAll { constants.contains(it) }
            if (!leaked.empty) {
                throw new GradleException("Release JAR is not reobfuscated; found MCP names: ${leaked.join(', ')}")
            }
            if (!constants.contains('func_151463_i')) {
                throw new GradleException('Release JAR does not contain the expected SRG KeyBinding method name')
            }
        } finally {
            archive.close()
        }
    }
}

build.dependsOn verifyProductionJar
